name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' doesn't match the required stable release format v<major>.<minor>.<patch> (e.g. v1.2.3)."
            exit 1
          fi
          echo "Tag OK: $TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Verify tag matches manifest version
        id: get_version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' dist/manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION doesn't match dist/manifest.json version $MANIFEST_VERSION. Update the version in src/manifest.json before tagging."
            exit 1
          fi
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create extension package
        run: |
          cd dist
          zip -r ../chrome_download_manager.zip .
          cd ..
          echo "Package created: chrome_download_manager.zip"
          ls -lh chrome_download_manager.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome_download_manager-${{ steps.get_version.outputs.version }}
          path: chrome_download_manager.zip

      - name: Check Chrome Web Store credentials
        id: store_creds
        env:
          EXT_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -n "$EXT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: ${{ steps.store_creds.outputs.configured != 'true' }}
          generate_release_notes: true
          files: chrome_download_manager.zip
          body: |
            ## Advanced Download Manager ${{ github.ref_name }}

            Chrome extension for advanced download management with cookie forwarding.

            ### Installation
            1. Download `chrome_download_manager.zip` below
            2. Extract it
            3. Open `chrome://extensions/`, enable "Developer mode", click "Load unpacked", and select the extracted folder

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.

      - name: Publish to Chrome Web Store
        if: steps.store_creds.outputs.configured == 'true'
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: chrome_download_manager.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.store_creds.outputs.configured }}" == "true" ]; then
            echo "✅ Release ${{ github.ref_name }} created and published to the Chrome Web Store."
          else
            echo "⚠️ Chrome Web Store credentials aren't configured (CHROME_EXTENSION_ID / CHROME_CLIENT_ID / CHROME_CLIENT_SECRET / CHROME_REFRESH_TOKEN)."
            echo "Created a DRAFT GitHub Release instead of publishing. To finish this release:"
            echo "  1. Add those four repo secrets (see .github/PUBLISHING.md), or"
            echo "  2. Manually publish the draft release and upload chrome_download_manager.zip to the Chrome Web Store Developer Dashboard yourself."
          fi
