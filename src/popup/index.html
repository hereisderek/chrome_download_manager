<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Choose Download Method</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="messageSlot"></div>

    <h1 class="title">Download</h1>

    <div class="summary">
      <div class="summary-icon" id="summaryIcon"></div>
      <div class="summary-text">
        <p class="summary-filename" id="downloadFilename"></p>
        <p class="summary-meta">
          <span id="downloadSize"></span><span class="dot">&middot;</span><span id="cookieCount"></span>
        </p>
        <p class="summary-url" id="downloadUrl"></p>
      </div>
    </div>

    <div class="options">
      <button id="defaultBtn" class="option-row" type="button">
        <span class="option-icon" id="defaultIcon"></span>
        <span class="option-text">
          <strong>Chrome downloader</strong>
          <small>Use Chrome's built-in downloader</small>
        </span>
      </button>

      <button id="exportCurlBtn" class="option-row" type="button" data-tool="curl">
        <span class="option-icon" id="exportCurlIcon"></span>
        <span class="option-text">
          <strong>cURL command</strong>
          <small>Show a ready-to-run command with cookies</small>
        </span>
      </button>

      <button id="exportWgetBtn" class="option-row" type="button" data-tool="wget">
        <span class="option-icon" id="exportWgetIcon"></span>
        <span class="option-text">
          <strong>wget command</strong>
          <small>Show a ready-to-run command with cookies</small>
        </span>
      </button>

      <div id="commandPanel" class="command-panel hidden">
        <p id="commandWarning" class="command-warning hidden"></p>

        <div id="sshOverridesGroup" class="ssh-overrides-group hidden">
          <div class="command-input-group">
            <label for="sshDestinationInput">Remote destination folder / file (optional):</label>
            <input type="text" id="sshDestinationInput" placeholder="e.g. /home/user/downloads or custom_name.zip">
          </div>

          <div class="command-input-group">
            <label for="sshPasswordInput">SSH Password override (optional):</label>
            <div class="password-wrapper">
              <input type="password" id="sshPasswordInput" placeholder="Leave empty to use saved config">
              <button type="button" id="togglePasswordBtn" class="toggle-password-btn" title="Toggle password visibility">Show</button>
            </div>
          </div>

          <div class="command-input-group">
            <label for="sshKeyFileInput">SSH Private Key file path (optional):</label>
            <input type="text" id="sshKeyFileInput" placeholder="e.g. ~/.ssh/id_ed25519 or /home/user/.ssh/id_rsa">
          </div>

          <details class="ssh-key-content-details">
            <summary>SSH Private Key content (optional)</summary>
            <div class="command-input-group">
              <textarea id="sshKeyContentInput" rows="3" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
            </div>
          </details>
        </div>

        <div id="commandOptions" class="command-options">
          <label class="command-checkbox-label">
            <input type="checkbox" id="compressCommandCheckbox">
            <span>Compress command (shorter one-liner)</span>
          </label>
        </div>
        <div class="command-box">
          <code id="commandText"></code>
        </div>
        <div class="command-actions">
          <button id="copyCommandBtn" class="copy-btn" type="button">Copy</button>
          <button id="closeCommandBtn" class="ghost-btn" type="button">Close</button>
        </div>
      </div>

      <div class="option-section">
        <div class="section-header">
          <h2>Command templates</h2>
          <a href="#" id="configureCustomLink" class="section-link">Configure</a>
        </div>
        <div id="customCommands"></div>
      </div>

      <div class="option-section">
        <div class="section-header">
          <h2>Local downloaders</h2>
          <a href="#" id="configureLocalLink" class="section-link">Configure</a>
        </div>
        <div id="localDownloaders"></div>
      </div>

      <div class="option-section">
        <div class="section-header">
          <h2>Remote downloaders</h2>
          <a href="#" id="configureRemoteLink" class="section-link">Configure</a>
        </div>
        <div id="remoteDownloaders"></div>
      </div>
    </div>

    <div class="footer">
      <a href="#" id="openOptionsPageLink" class="footer-link">Options / Settings</a>
      <button id="cancelBtn" class="ghost-btn" type="button">Cancel</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
